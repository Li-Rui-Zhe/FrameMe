<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>裁剪编辑器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #fafafa;
      line-height: 1.6;
      min-height: 100vh;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: #141414;
      border-bottom: 1px solid #262626;
    }
    .toolbar-title {
      font-size: 0.9375rem;
      font-weight: 600;
      flex: 1;
    }
    .toolbar-info {
      font-size: 0.75rem;
      color: #a1a1aa;
    }
    .btn {
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost {
      background: #262626;
      color: #fafafa;
    }
    .btn-ghost:hover { background: #333; }
    .btn-primary {
      background: #fafafa;
      color: #171717;
    }
    .btn-primary:hover { opacity: 0.9; }
    .status-msg {
      font-size: 0.75rem;
      color: #a1a1aa;
      min-width: 120px;
      text-align: right;
    }
    .canvas-wrap {
      padding: 1rem 1.5rem;
      overflow: auto;
    }
    canvas {
      display: block;
      cursor: default;
    }
    .help-bar {
      padding: 0.5rem 1.5rem;
      font-size: 0.75rem;
      color: #737379;
      border-top: 1px solid #262626;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #141414;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-title">裁剪编辑器 — <span id="stateName">...</span></div>
    <div class="toolbar-info" id="infoText">加载中...</div>
    <button class="btn btn-ghost" id="resetBtn">重置</button>
    <button class="btn btn-primary" id="applyBtn">应用裁剪</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="help-bar">
    拖动红色竖线调整裁剪位置 | 每帧裁切区域实时预览在下方 | 调整完毕后点击"应用裁剪"保存
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const stripPath = params.get('strip_path');
    const stateName = params.get('state') || 'idle';
    const frameSize = parseInt(params.get('frame_size') || '512', 10);
    const padding = parseInt(params.get('padding') || '16', 10);
    const frameCount = parseInt(params.get('frame_count') || '6', 10);

    document.getElementById('stateName').textContent = stateName;
    document.title = `裁剪编辑器 — ${stateName}`;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const infoText = document.getElementById('infoText');
    const statusMsg = document.getElementById('statusMsg');
    const applyBtn = document.getElementById('applyBtn');
    const resetBtn = document.getElementById('resetBtn');

    let stripImg = null;
    let scale = 1;
    let splitXs = [];
    let defaultXs = [];
    let dragging = -1;
    const PREVIEW_H = 160;
    const LINE_HIT = 8;

    // Load strip
    fetch('/prepare-strip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ strip_path: stripPath }),
    })
      .then(r => r.json())
      .then(data => {
        if (!data.ok) {
          infoText.textContent = '加载失败: ' + (data.error || '');
          return;
        }
        const img = new Image();
        img.onload = () => {
          stripImg = img;
          infoText.textContent = `${img.width} x ${img.height} | ${frameCount} 帧`;
          const w = img.width;
          defaultXs = [];
          for (let i = 1; i < frameCount; i++) {
            defaultXs.push(Math.floor(i * w / frameCount));
          }
          splitXs = [...defaultXs];
          draw();
        };
        img.src = 'data:image/png;base64,' + data.image;
      })
      .catch(err => {
        infoText.textContent = '请求失败: ' + err.message;
      });

    function draw() {
      if (!stripImg) return;
      const imgW = stripImg.width;
      const imgH = stripImg.height;

      // Use full window width minus padding
      const availW = window.innerWidth - 48;
      scale = availW / imgW;
      // Clamp: don't upscale beyond 1:1, don't shrink too much
      scale = Math.min(scale, 1);

      const dispW = Math.round(imgW * scale);
      const dispH = Math.round(imgH * scale);
      const totalH = dispH + PREVIEW_H + 40;

      canvas.width = dispW;
      canvas.height = totalH;

      // Checkerboard
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, dispW, dispH);
      for (let py = 0; py < dispH; py += 12) {
        for (let px = 0; px < dispW; px += 12) {
          if ((px + py) % 24 === 0) {
            ctx.fillStyle = '#222';
            ctx.fillRect(px, py, 12, 12);
          }
        }
      }

      // Strip
      ctx.drawImage(stripImg, 0, 0, dispW, dispH);

      // Split lines
      ctx.strokeStyle = 'rgba(255, 70, 70, 0.95)';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 3]);
      splitXs.forEach((sx, i) => {
        const dx = sx * scale;
        ctx.beginPath();
        ctx.moveTo(dx, 0);
        ctx.lineTo(dx, dispH);
        ctx.stroke();
      });
      ctx.setLineDash([]);
      ctx.lineWidth = 1;

      // Split line handles (circles)
      splitXs.forEach((sx, i) => {
        const dx = sx * scale;
        ctx.fillStyle = dragging === i ? '#22c55e' : '#ff4646';
        ctx.beginPath();
        ctx.arc(dx, 16, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), dx, 19);
        ctx.textAlign = 'start';
      });

      // Frame previews
      const prevY = dispH + 12;
      const positions = [0, ...splitXs, imgW];
      const nFrames = positions.length - 1;
      const gap = 8;
      const totalGap = gap * (nFrames - 1);
      const cellW = Math.max(60, Math.floor((dispW - totalGap - 16) / nFrames));

      positions.slice(0, -1).forEach((x0, i) => {
        const x1 = positions[i + 1];
        const cropW = x1 - x0;
        const pScale = Math.min(cellW / cropW, PREVIEW_H / imgH) * 0.9;
        const pw = Math.round(cropW * pScale);
        const ph = Math.round(imgH * pScale);
        const px = 8 + i * (cellW + gap) + (cellW - pw) / 2;
        const py = prevY + (PREVIEW_H - ph) / 2;

        // Background
        ctx.fillStyle = '#111';
        ctx.fillRect(px - 2, py - 2, pw + 4, ph + 4);

        // Cropped image
        ctx.save();
        ctx.beginPath();
        ctx.rect(px, py, pw, ph);
        ctx.clip();
        ctx.drawImage(stripImg, x0, 0, cropW, imgH, px, py, pw, ph);
        ctx.restore();

        // Border
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        ctx.strokeRect(px - 2, py - 2, pw + 4, ph + 4);

        // Label
        ctx.fillStyle = '#888';
        ctx.font = '11px monospace';
        ctx.fillText(`#${i + 1}`, px, py + ph + 14);
      });
    }

    // Drag handling
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const dispH = Math.round(stripImg.height * scale);
      if (my > dispH + 10) return;

      for (let i = 0; i < splitXs.length; i++) {
        const dx = splitXs[i] * scale;
        if (Math.abs(mx - dx) <= LINE_HIT) {
          dragging = i;
          canvas.style.cursor = 'ew-resize';
          return;
        }
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (dragging < 0 || !stripImg) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const imgX = Math.round(mx / scale);
      const minBound = dragging > 0 ? splitXs[dragging - 1] + 20 : 20;
      const maxBound = dragging < splitXs.length - 1 ? splitXs[dragging + 1] - 20 : stripImg.width - 20;
      splitXs[dragging] = Math.max(minBound, Math.min(maxBound, imgX));
      draw();
    });

    window.addEventListener('mouseup', () => {
      if (dragging >= 0) {
        dragging = -1;
        canvas.style.cursor = 'default';
        draw();
      }
    });

    // Resize
    window.addEventListener('resize', () => { if (stripImg) draw(); });

    // Reset
    resetBtn.addEventListener('click', () => {
      splitXs = [...defaultXs];
      draw();
      statusMsg.textContent = '已重置';
      setTimeout(() => { statusMsg.textContent = ''; }, 2000);
    });

    // Apply
    applyBtn.addEventListener('click', async () => {
      applyBtn.disabled = true;
      statusMsg.textContent = '应用中...';
      try {
        const res = await fetch('/apply-crops', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            strip_path: stripPath,
            state: stateName,
            frame_size: frameSize,
            padding: padding,
            split_positions: splitXs,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          statusMsg.textContent = `已保存 ${data.frame_count} 帧`;
        } else {
          statusMsg.textContent = '失败: ' + (data.error || '');
        }
      } catch (err) {
        statusMsg.textContent = '请求失败: ' + err.message;
      } finally {
        applyBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
